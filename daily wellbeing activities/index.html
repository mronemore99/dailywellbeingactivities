        }
        .activity-container {

            gap: 20px;
            max-width: 1200px;
            width: 100%;

            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            padding: 20px;

            display: flex;
            align-items: flex-start;
            gap: 15px;
        }
        .activity-card:hover {

        }

            font-size: 2em;

            align-items: center;
            justify-content: center;
            width: 50px;
            height: 50px;

        // Function to generate random activities and tagline
        function generateActivities() {
            const activityContainer = document.getElementById('activityContainer');
            const challengeText = document.getElementById('challengeText');
            if (!activityContainer || !challengeText) {
                console.error('Activity container or challenge text not found!');
                return;
            }
            activityContainer.innerHTML = ''; // Clear previous activities

            // Select random tagline
            const randomTagline = taglines[Math.floor(Math.random() * taglines.length)];
            challengeText.textContent = randomTagline;

            // Shuffle groups and select 6
            const shuffledGroups = [...activities].sort(() => 0.5 - Math.random());
            const selectedGroups = shuffledGroups.slice(0, 6);

            // Generate HTML for activities
            selectedGroups.forEach(group => {
                const randomActivity = group.items[Math.floor(Math.random() * group.items.length)];
                const card = document.createElement('div');
                card.className = 'activity-card';
                card.innerHTML = `
                    <div class="icon ${group.colorClass}">
                        <i class="${group.icon}"></i>
                    </div>
                    <div class="activity-content">
                        <h3>${group.group}</h3>
                        <p>${randomActivity}</p>
                    </div>
                `;
                activityContainer.appendChild(card);
            });
            // console.log('Generated activities:', selectedGroups.map(g => g.group), 'Tagline:', randomTagline);
        }

        // Generate activities on page load
        window.onload = generateActivities;
    </script>
